# Plan morning-digest § 3 and § 4: the review copy of the digest page on GitHub Pages.
# The page is built here and never committed (ADR 0003: no previews in the repo).
# marker: the lane marker for the banner; empty → "no marker set" (§ 4). The marker is public on
# the page anyway; delete the marked run once the clean page is up (ADR 0003).
name: preview

on:
  workflow_dispatch:
    inputs:
      night:
        description: night to render
        default: '2026-10-28'
        required: true
      marker:
        description: lane marker for the banner (empty for the clean copy)
        default: ''
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: save the page
        env:
          LANE_MARKER: ${{ inputs.marker }}
        run: scripts/save-preview.sh "${{ inputs.night }}" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
